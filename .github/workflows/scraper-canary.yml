name: Letterboxd scraper canary

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: letterboxd-scraper-canary
  cancel-in-progress: true

jobs:
  check-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scraper dependencies
        run: pip install curl-cffi beautifulsoup4 lxml brotli
      - name: Check one public watchlist page
        run: PYTHONPATH=backend python -m scripts.check_scraper enesaysu
      - name: Check watched-history pagination
        # Letterboxd may issue a Cloudflare challenge to a shared GitHub runner.
        # Keep the evidence in the workflow log, but do not turn a transient
        # upstream access decision into a failed repository check.
        run: |
          if ! PYTHONPATH=backend python -m scripts.check_scraper enesaysu --list films --pages 2; then
            echo "::warning::Letterboxd ikinci sayfa erişimini GitHub runner'da engelledi; scraping canary kaydı için logu incele."
          fi
