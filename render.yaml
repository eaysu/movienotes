services:
  - type: web
    name: movie-boxd
    env: python
    plan: free
    # Komutlar backend/ içinden koşuyor, böylece `app` paketi PYTHONPATH
    # gerektirmeden içe aktarılıyor. Depo tamamen klonlanıyor; statik dosyalar
    # depo köküne göre çözüldüğü için frontend/ yine bulunuyor.
    # Bu alan panelde de ayarlı olmalı (Settings → Root Directory: backend),
    # aksi hâlde elle oluşturulmuş servis bu dosyayı okumaz.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One process is intentional: the application's Letterboxd request budget
    # and full-profile queue must remain process-wide and strictly serialized.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level warning
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TMDB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini-2025-08-07
      - key: NUM_RECOMMENDATIONS
        value: "5"
      - key: LETTERBOXD_MIN_INTERVAL_SECONDS
        value: "4"
      - key: RECOMMENDATION_HISTORY_LIMIT
        value: "100"
      - key: FAVORITE_DIRECTOR_BOOST
        value: "0.08"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_IDENTITY_SECRET
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
